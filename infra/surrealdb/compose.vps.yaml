# SurrealDB en VPS/Coolify (mismo patrón que el ledger). SURREAL_ROOT_PASS se define como
# variable de entorno del servicio en Coolify (nunca en este archivo).
services:
  surrealdb:
    image: 'surrealdb/surrealdb:v4.0.1'
    restart: unless-stopped
    user: root
    command: 'start --log info --user root --pass ${SURREAL_ROOT_PASS} rocksdb:/data/dooh.db'
    ports:
      - '18101:8000'
    volumes:
      - 'surreal_data:/data'
